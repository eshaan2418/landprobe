name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu || pip install torch torchvision
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Type check
        run: mypy
      - name: Unit + property tests
        run: pytest -q
      - name: Smoke pretrain/probe/fine-tune on fixture tiles
        run: pytest -q tests/test_smoke.py
