[project]
name = "landprobe"
version = "0.1.0"
description = "Label-efficient land-use classification from satellite tiles: self-supervised pretraining vs supervised and ImageNet baselines on EuroSAT"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Eshaan Kapooswalla", email = "eshaank@my.yorku.ca" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "torch>=2.3", "torchvision>=0.18", "pillow>=10", "pyyaml>=6"]

[project.optional-dependencies]
eval = ["matplotlib>=3.8"]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
landprobe = "landprobe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/landprobe"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["UP031"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["src/landprobe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
